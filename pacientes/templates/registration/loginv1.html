<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7f4;
            margin: 40px;
        }

        .contenedor {
            max-width: 420px;
            margin: 80px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #198754;
        }

        form p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #198754;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .error {
            background-color: #f8d7da;
            color: #842029;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Iniciar sesión</h1>

        {% if form.errors %}
            <div class="error">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Ingresar
            </button>

        </form>

    </div>

</body>

</html>
