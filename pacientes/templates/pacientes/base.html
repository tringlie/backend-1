<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Veterinaria{% endblock %}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7f4;
            margin: 0;
        }

        .navbar {
            background-color: #198754;
            padding: 14px 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .marca {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu a,
        .menu button {
            color: white;
            background: transparent;
            border: none;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu a:hover,
        .menu button:hover {
            background-color: rgba(255, 255, 255, 0.18);
        }

        .logout-form {
            margin: 0;
        }

        .contenedor {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #198754;
        }

        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .boton {
            display: inline-block;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
        }

        .agregar {
            background-color: #198754;
        }

        .editar {
            background-color: #0d6efd;
        }

        .eliminar {
            background-color: #dc3545;
        }

        .mensaje {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .filtros {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;

            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filtros input,
        .filtros select,
        .filtros button {
            padding: 9px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .filtros input {
            flex: 1;
            min-width: 200px;
        }

        .filtros button {
            background-color: #198754;
            color: white;
            border: none;
            cursor: pointer;
        }

        .tabla-contenedor {
            overflow-x: auto;
            background-color: white;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: #198754;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .acciones {
            white-space: nowrap;
        }

        .activo {
            color: #0f5132;
            background-color: #d1e7dd;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 6px;
        }

        .inactivo {
            color: #664d03;
            background-color: #fff3cd;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 6px;
        }

        .fallecido {
            color: #842029;
            background-color: #f8d7da;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 6px;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
            }

            .filtros {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="marca">
            🐾 Veterinaria
        </div>

        <div class="menu">

            <a href="{% url 'listar_mascotas' %}">
                Mascotas
            </a>

            <a href="{% url 'listar_duenos' %}">
                Dueños
            </a>

            <a href="{% url 'listar_citas' %}">
                Citas
            </a>

            <form
                method="POST"
                action="{% url 'logout' %}"
                class="logout-form"
            >
                {% csrf_token %}

                <button type="submit">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </nav>

    <main class="contenedor">

        {% if messages %}
            {% for message in messages %}
                <div class="mensaje">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}
        {% endblock %}

    </main>

</body>

</html>
