<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar dueño</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f7f4;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #198754;
            text-align: center;
        }

        form p {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 9px;
            box-sizing: border-box;
        }

        button,
        a {
            display: inline-block;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        button {
            background-color: #198754;
            color: white;
        }

        a {
            background-color: #6c757d;
            color: white;
        }

        .errorlist {
            color: #842029;
            background-color: #f8d7da;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Editar {{ dueno.nombre }}</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Guardar cambios
            </button>

            <a href="{% url 'listar_duenos' %}">
                Cancelar
            </a>

        </form>

    </div>

</body>

</html>
